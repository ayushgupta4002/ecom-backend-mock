services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecom"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ecom_pgdata:/var/lib/postgresql/data

  # The API. Started only with the "api" profile so that `docker compose up -d`
  # brings up just the database for local Go development:
  #   docker compose up -d                     -> database only
  #   docker compose --profile api up --build  -> database + API
  api:
    profiles: ["api"]
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ecom?sslmode=disable
      HTTP_ADDR: ":8080"
      REWARD_MILESTONE_N: "5"
      REWARD_DISCOUNT_PERCENT: "10"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ecom_pgdata:
